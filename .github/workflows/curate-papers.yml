name: Daily Paper Curation

on:
  schedule:
    - cron: '0 8 * * *' # 08:00 UTC daily — auto-detects date range from DB
  workflow_dispatch:
    inputs:
      date:
        description: 'Override date (YYYY-MM-DD). Omit to auto-detect from DB.'
        required: false
        type: string
      persona:
        description: 'Bot persona'
        required: false
        default: 'mendeleev'
        type: string

concurrency:
  group: paper-curation
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Run curation pipeline
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
          INPUT_PERSONA: ${{ github.event.inputs.persona || 'mendeleev' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BOT_USER_ID_MENDELEEV: ${{ secrets.BOT_USER_ID_MENDELEEV }}
        run: |
          PERSONA="${INPUT_PERSONA:-mendeleev}"
          if [ -n "$INPUT_DATE" ]; then
            npx tsx scripts/curate-papers.ts --date "$INPUT_DATE" --persona "$PERSONA"
          else
            npx tsx scripts/curate-papers.ts --persona "$PERSONA"
          fi

      - name: Upload curation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curation-output-${{ github.run_id }}
          path: output/
          retention-days: 30
          if-no-files-found: ignore

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const date = process.env.INPUT_DATE || new Date(Date.now() - 86400000).toISOString().slice(0, 10);
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const title = `Paper curation failed: ${date}`;
            const body = `The daily paper curation pipeline failed.\n\n**Run:** ${runUrl}\n\nCheck the workflow logs for details.`;
            const commentBody = `Another daily paper curation run failed.\n\n**Date:** ${date}\n**Run:** ${runUrl}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: 'curation-failure',
              per_page: 20,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title)
              || issues.find((issue) => !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: commentBody,
              });
              return;
            }
            await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
              labels: ['bot', 'curation-failure'],
            });
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
